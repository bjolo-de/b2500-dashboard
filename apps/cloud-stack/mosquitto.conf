# Mosquitto config for the b2500-stack fly.io VM.
# Listener on 1883, plain (no TLS — B2500 firmware doesn't trust Let's Encrypt).
# Auth required; password file generated by entrypoint.sh from env vars.

listener 1883 0.0.0.0
protocol mqtt

allow_anonymous false
password_file /run/mosquitto/passwords

persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 1800

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

max_keepalive 65535
